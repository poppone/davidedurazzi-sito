<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin community</title>
<link rel="icon" type="image/png" href="/assets/logo-64.png">
<link rel="stylesheet" href="/style.css">
<style>
  .mod{max-width:760px;margin:0 auto;padding:1.5rem clamp(1rem,4vw,2rem) 4rem}
  .mod h1{font:800 2rem/1.1 var(--sans);margin:.5rem 0 1rem}
  .mod h2{font:800 1.3rem var(--sans);margin:2rem 0 .8rem}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:.8rem 1rem;margin-bottom:.6rem}
  .card.off{opacity:.5}
  .card .dove{color:var(--muted);font-size:.88rem}
  .card p{margin:.3rem 0 .6rem;white-space:pre-line;overflow-wrap:anywhere}
  .vuoto,.esito{color:var(--muted)}
  .login{display:grid;gap:.7rem;max-width:360px}
  .login input,.mod textarea{width:100%;font:400 1rem var(--sans);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:.65rem .75rem}
</style>
</head>
<body>
<main class="mod">
  <a href="/admin/">← Pannello admin</a>
  <h1>Community</h1>
  <div id="app"></div>
</main>
<script>
(function () {
  var app = document.getElementById("app"), pw = sessionStorage.getItem("pw") || "";
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function api(a, corpo) {
    return fetch("/api/community?a=" + a, { method: "POST", headers: { "Content-Type": "application/json", "x-admin-password": pw }, body: JSON.stringify(corpo || {}) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.errore || "Errore"); return j; }); });
  }
  function login(m) {
    app.innerHTML = '<form class="login" id="f"><label>Password<input type="password" id="p" required></label><button class="btn pieno" type="submit">Entra</button>' + (m ? '<p class="esito">' + esc(m) + '</p>' : '') + '</form>';
    document.getElementById("f").onsubmit = function (e) { e.preventDefault(); pw = document.getElementById("p").value; sessionStorage.setItem("pw", pw); carica(); };
  }
  function carica() {
    api("admin-elenco").then(disegna).catch(function (e) {
      if (/Password/.test(e.message)) { sessionStorage.removeItem("pw"); login("Password errata."); } else app.innerHTML = '<p class="vuoto">' + esc(e.message) + '</p>';
    });
  }
  function disegna(j) {
    var h = '<p>Iscritti: <b>' + j.utenti + '</b> <button class="btn" id="csv" type="button">Scarica contatti (CSV)</button></p>';
    h += '<h2>Temi proposti (' + j.temi.length + ')</h2>';
    var temi = j.temi.slice().sort(function (a, b) { return b.voti - a.voti; });
    h += temi.length ? temi.map(function (t) {
      return '<div class="card' + (t.nascosto ? " off" : "") + '"><b>▲ ' + t.voti + '</b> ' + esc(t.titolo) + '<div class="dove">di ' + esc(t.nome) + '</div>' +
        '<button class="btn" data-tipo="tema" data-id="' + t.id + '" data-n="' + (t.nascosto ? 0 : 1) + '" type="button">' + (t.nascosto ? "Mostra" : "Nascondi") + '</button></div>';
    }).join("") : '<p class="vuoto">Nessun tema.</p>';
    h += '<h2>Messaggi (' + j.posts.length + ')</h2>';
    h += j.posts.length ? j.posts.map(function (p) {
      return '<div class="card' + (p.nascosto ? " off" : "") + '"><b>' + esc(p.nome) + '</b> <span class="dove">' + new Date(p.data).toLocaleString("it-IT") + (p.segn ? " · " + p.segn + " segnalazioni" : "") + '</span><p>' + esc(p.testo) + '</p>' +
        '<button class="btn" data-tipo="post" data-id="' + p.id + '" data-n="' + (p.nascosto ? 0 : 1) + '" type="button">' + (p.nascosto ? "Mostra" : "Nascondi") + '</button></div>';
    }).join("") : '<p class="vuoto">Nessun messaggio.</p>';
    app.innerHTML = h;
    app.querySelectorAll("button[data-id]").forEach(function (b) {
      b.onclick = function () { api("admin-nascondi", { tipo: b.dataset.tipo, id: b.dataset.id, nascondi: b.dataset.n === "1" }).then(carica).catch(function (e) { alert(e.message); }); };
    });
    document.getElementById("csv").onclick = function () {
      api("admin-contatti").then(function (r) {
        var righe = ["nome,email,data"].concat(r.contatti.map(function (c) { return [c.nome, c.email, c.data].map(function (x) { return '"' + String(x).replace(/"/g, '""') + '"'; }).join(","); }));
        var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([righe.join("\n")], { type: "text/csv" })); a.download = "contatti-community.csv"; a.click();
      }).catch(function (e) { alert(e.message); });
    };
  }
  if (pw) carica(); else login();
})();
</script>
</body>
</html>
