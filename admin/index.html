<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pannello admin</title>
<link rel="icon" type="image/png" href="/assets/logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .mod{max-width:760px;margin:0 auto;padding:1.5rem clamp(1rem,4vw,2rem) 4rem}
  .mod h1{font:800 2rem/1.1 var(--sans);font-stretch:112%;margin:.5rem 0 1rem}
  .mod h2{font:800 1.3rem var(--sans);margin:2rem 0 .8rem}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.8rem}
  .card .chi{font-weight:700}
  .card .dove{color:var(--muted);font-size:.88rem;margin:.1rem 0 .6rem}
  .card p{margin:.3rem 0 .8rem;white-space:pre-line}
  .card textarea,.login input{width:100%;font:400 1rem var(--sans);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:.65rem .75rem}
  .card textarea{min-height:7rem;margin:.4rem 0 .7rem}
  .btn.rosso{border-color:var(--anti);color:var(--anti)}
  .esito{font-size:.92rem;color:var(--muted);margin-top:.5rem}
  .vuoto{color:var(--muted)}
  .login{display:grid;gap:.7rem;max-width:360px}
</style>
</head>
<body>
<main class="mod">
  <a class="logo" href="/"><img src="/assets/logo-64.png" alt="" width="34" height="34">Davide Durazzi</a>
  <h1>Pannello admin</h1>
  <div id="app"></div>
</main>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var pw = sessionStorage.getItem("pw") || "";
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  function api(corpo) {
    return fetch("/api/admin", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-admin-password": pw },
      body: JSON.stringify(corpo)
    }).then(function (r) {
      return r.text().then(function (t) {
        var j; try { j = JSON.parse(t); } catch (e) { throw new Error(r.status === 504 ? "Il server ha impiegato troppo tempo. Premi Aggiorna: il commento potrebbe essere già approvato." : "Errore del server (" + r.status + "). Premi Aggiorna e riprova."); }
        if (!r.ok) throw new Error(j.errore || "Errore"); return j;
      });
    });
  }

  function login(msg) {
    app.innerHTML = '<form class="login" id="f"><label>Password<input type="password" id="p" autocomplete="current-password" required></label>' +
      '<button class="btn pieno" type="submit">Entra</button>' + (msg ? '<p class="esito">' + esc(msg) + '</p>' : '') + '</form>';
    document.getElementById("f").addEventListener("submit", function (e) {
      e.preventDefault(); pw = document.getElementById("p").value; sessionStorage.setItem("pw", pw); carica();
    });
  }

  function carica() {
    app.innerHTML = '<p class="vuoto">Caricamento.</p>';
    var contenuti = api({ azione: "contenuti" }).catch(function (e) { return { errore: e.message }; });
    api({ azione: "elenco" }).then(function (j) { return contenuti.then(function (c) { disegna(j, c); }); }).catch(function (e) {
      if (/Password/.test(e.message)) { sessionStorage.removeItem("pw"); login("Password errata."); }
      else app.innerHTML = '<p class="vuoto">' + esc(e.message) + '</p>';
    });
  }

  function link(c) { return '<a href="/articolo?slug=' + encodeURIComponent(c.slug) + '" target="_blank" rel="noopener">articolo</a>'; }
  function data(d) { return new Date(d).toLocaleString("it-IT", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }

  function sezContenuti(c) {
    if (!c || c.errore) return '<h2>Articoli e bozze</h2><p class="vuoto">' + esc((c && c.errore) || "Non disponibili") + '</p>';
    var h = '<h2>Bozze da approvare (' + c.bozze.length + ')</h2>';
    h += c.bozze.length ? c.bozze.map(function (x) {
      return '<div class="card" data-slug="' + esc(x.slug) + '"><div class="chi">' + esc(x.titolo) + '</div><div class="dove">' + esc(x.sezione || "") + ' \u00b7 ' + esc(x.data || "") + '</div>' +
        '<p>' + esc(x.sommario || "") + '</p>' + (x.domanda ? '<div class="dove">Contraddittorio: ' + esc(x.domanda) + '</div>' : '') + (x.nota ? '<div class="dove">Nota del Critico: ' + esc(x.nota) + '</div>' : '') +
        '<div class="acts"><button class="btn pieno" data-az="approva_bozza" type="button">Approva e pubblica (sito + Instagram)</button>' +
        '<button class="btn rosso" data-az="scarta_bozza_articolo" type="button">Scarta</button></div><div class="esito"></div></div>';
    }).join("") : '<p class="vuoto">Nessuna bozza in attesa.</p>';
    if (c.inCoda && c.inCoda.length) h += '<p class="esito">In pubblicazione: ' + c.inCoda.map(esc).join(", ") + '</p>';
    h += '<h2>Articoli (' + c.articoli.length + ')</h2>';
    h += c.articoli.length ? c.articoli.map(function (x) {
      return '<div class="card" data-slug="' + esc(x.slug) + '"><div class="chi">' + esc(x.titolo) + (x.pubblicato ? '' : ' <span class="dove">(tolto dal sito)</span>') + '</div>' +
        '<div class="dove">' + esc(x.sezione || "") + ' \u00b7 ' + esc(x.data || "") + (x.pubblicato ? ' \u00b7 <a href="/articoli/' + encodeURIComponent(x.slug) + '" target="_blank" rel="noopener">apri</a>' : '') + '</div>' +
        '<div class="acts">' + (x.pubblicato
          ? '<button class="btn rosso" data-az="togli_articolo" type="button">Togli dal sito</button>'
          : '<button class="btn pieno" data-az="ripubblica_articolo" type="button">Ripubblica</button>') + '</div><div class="esito"></div></div>';
    }).join("") : '<p class="vuoto">Nessun articolo.</p>';
    return h;
  }

  function disegna(j, cont) {
    var h = sezContenuti(cont) + '<h1 style="margin-top:3rem;font-size:1.5rem">Commenti</h1><h2>Da approvare (' + j.attesa.length + ')</h2>';
    h += j.attesa.length ? j.attesa.map(function (c) {
      return '<div class="card" data-id="' + esc(c.id) + '"><div class="chi">' + esc(c.nome) + '</div><div class="dove">' + data(c.data) + ', ' + link(c) + '</div>' +
        '<p>' + esc(c.testo) + '</p>' +
        '<label class="dove">La tua risposta (facoltativa: se la lasci vuota risponde l\u2019agente)</label><textarea placeholder="Scrivi qui se vuoi rispondere tu"></textarea>' +
        '<div class="acts"><button class="btn pieno" data-az="approva" type="button">Approva</button>' +
        '<button class="btn rosso" data-az="elimina" type="button">Elimina</button></div><div class="esito"></div></div>';
    }).join("") : '<p class="vuoto">Nessun commento in attesa.</p>';

    h += '<h2>Risposte da rivedere (' + j.bozze.length + ')</h2>';
    h += j.bozze.length ? j.bozze.map(function (c) {
      return '<div class="card" data-id="' + esc(c.id) + '"><div class="chi">' + esc(c.nome) + '</div><div class="dove">' + data(c.data) + ', ' + link(c) + '</div>' +
        '<p>' + esc(c.testo) + '</p><label class="dove">La tua risposta (bozza dell\u2019AI, modificala come vuoi)</label>' +
        '<textarea>' + esc(c.bozza) + '</textarea><div class="acts"><button class="btn pieno" data-az="rispondi" type="button">Pubblica col mio nome</button>' +
        '<button class="btn" data-az="scarta_bozza" type="button">Non rispondere</button></div><div class="esito"></div></div>';
    }).join("") : '<p class="vuoto">Nessuna bozza da rivedere.</p>';

    var pub = j.pubblicati || [];
    h += '<h2>Commenti pubblicati (' + pub.length + ')</h2>';
    h += pub.length ? pub.map(function (c) {
      var r = c.risposta, mia = r && !r.ai;
      return '<div class="card" data-id="' + esc(c.id) + '"><div class="chi">' + esc(c.nome) + '</div><div class="dove">' + data(c.data) + ', ' + link(c) + '</div>' +
        '<p>' + esc(c.testo) + '</p>' +
        (r ? '<div class="dove">Risposta attuale di <b>' + esc(r.autore) + '</b>' + (r.ai ? ' (automatica)' : '') + ':</div><p>' + esc(r.testo) + '</p>' : '<div class="dove">Nessuna risposta.</div>') +
        '<textarea placeholder="' + (r ? 'Scrivi qui per sostituirla con la tua' : 'Scrivi la tua risposta') + '">' + (mia ? esc(r.testo) : '') + '</textarea>' +
        '<div class="acts"><button class="btn pieno" data-az="rispondi" type="button">' + (r ? (mia ? 'Aggiorna risposta' : 'Sostituisci con la mia') : 'Rispondi col mio nome') + '</button>' +
        (r ? '<button class="btn" data-az="togli_risposta" type="button">Togli risposta</button>' : '') +
        '<button class="btn rosso" data-az="elimina" type="button">Elimina</button></div><div class="esito"></div></div>';
    }).join("") : '<p class="vuoto">Nessun commento pubblicato.</p>';

    h += '<h2>Newsletter</h2><div class="acts"><button class="btn" id="nlBtn" type="button">Mostra iscritti</button></div><textarea id="nlLista" readonly hidden style="width:100%;min-height:8rem;margin-top:.7rem"></textarea>';
    h += '<div class="acts" style="margin-top:2rem"><button class="btn" id="agg" type="button">Aggiorna</button></div>';
    app.innerHTML = h;
    document.getElementById("agg").addEventListener("click", carica);
    document.getElementById("nlBtn").addEventListener("click", function () {
      api({ azione: "iscritti" }).then(function (r) {
        var t = document.getElementById("nlLista"); t.hidden = false;
        t.value = r.iscritti.length ? r.iscritti.join("\n") : "Nessun iscritto per ora.";
        this.textContent = r.iscritti.length + " iscritti";
      }.bind(this)).catch(function (e) { alert(e.message); });
    });
  }

  app.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-az]"); if (!b) return;
    var card = b.closest(".card"), az = b.dataset.az, corpo = { azione: az, id: card.dataset.id };
    if (card.dataset.slug) {
      corpo.slug = card.dataset.slug;
      var conf = { togli_articolo: "Togliere l\u2019articolo dal sito?", scarta_bozza_articolo: "Scartare la bozza?", approva_bozza: "Approvare? Va online sul sito e su Instagram." }[az];
      if (conf && !confirm(conf)) return;
    }
    if (az === "elimina" && !confirm("Eliminare il commento?")) return;
    if (az === "rispondi" || az === "approva") corpo.testo = (card.querySelector("textarea") || {}).value || "";
    if (az === "rispondi" && !corpo.testo.trim()) { card.querySelector(".esito").textContent = "Scrivi prima la risposta."; return; }
    card.querySelectorAll("button").forEach(function (x) { x.disabled = true; });
    card.querySelector(".esito").textContent = az === "approva" ? (corpo.testo.trim() ? "Approvo con la tua risposta." : "Approvo e preparo la risposta.") : "Un attimo.";
    api(corpo).then(function (r) {
      card.querySelector(".esito").textContent = "Fatto: " + r.esito + ".";
      setTimeout(carica, 1200);
    }).catch(function (err) {
      card.querySelector(".esito").textContent = err.message;
      card.querySelectorAll("button").forEach(function (x) { x.disabled = false; });
    });
  });

  pw ? carica() : login();
})();
</script>
</body>
</html>
