name: Redazione del mattino

on:
  schedule:
    - cron: "0 5 * * *"   # 07:00 ora italiana (06:00 in inverno)
  workflow_dispatch:       # avvio manuale dal tab Actions

permissions:
  contents: write

jobs:
  redazione:
    runs-on: ubuntu-latest
    timeout-minutes: 40    # Blocco automatico se il job si incastra per più di 15 minuti

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r agenti/requirements.txt

      - name: Esegui agenti redazione
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"  # Stampa i log in tempo reale nella console di GitHub
        run: |
          mkdir -p bozze
          python agenti/main.py 2>&1 | tee bozze/ultimo-log.txt

      - name: Salva le bozze
        run: |
          git config user.name "redazione-ai"
          git config user.email "actions@users.noreply.github.com"
          git add bozze
          git diff --cached --quiet && exit 0
          git commit -m "Bozze del $(date +%d/%m/%Y)"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
          
