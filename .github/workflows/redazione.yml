name: Redazione del mattino

on:
  schedule:
    - cron: "0 5 * * *"   # 07:00 ora italiana (06:00 in inverno)
  workflow_dispatch:       # avvio manuale dal tab Actions

permissions:
  contents: write

jobs:
  redazione:
    runs-on: ubuntu-latest
    timeout-minutes: 15    # Blocco automatico se il job si incastra per più di 15 minuti

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r agenti/requirements.txt

      - name: Esegui agenti redazione
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PYTHONUNBUFFERED: "1"  # Stampa i log in tempo reale nella console di GitHub
        run: python agenti/main.py

      - name: Salva le bozze
        run: |
          git config user.name "redazione-ai"
          git config user.email "actions@users.noreply.github.com"
          git add bozze
          git diff --cached --quiet || (git commit -m "Bozze del $(date +%d/%m/%Y)" && git push)
          
