name: Redazione del mattino

on:
  schedule:
    - cron: "0 5 * * *"   # 07:00 ora italiana (06:00 in inverno)
  workflow_dispatch:       # avvio manuale dal tab Actions
    inputs:
      aree:
        description: "Solo queste aree, separate da virgola (es. gaming). Vuoto = palinsesto del giorno"
        required: false
        default: ""

permissions:
  contents: write
  models: read             # GitHub Models gratuito per la redazione AI

jobs:
  redazione:
    runs-on: ubuntu-latest
    timeout-minutes: 40    # Blocco automatico se il job si incastra per più di 15 minuti

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r agenti/requirements.txt

      - name: Esegui agenti redazione
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_ORDINE: ${{ vars.LLM_ORDINE }}
          AREE: ${{ github.event.inputs.aree }}
          PYTHONUNBUFFERED: "1"  # Stampa i log in tempo reale nella console di GitHub
        run: |
          mkdir -p bozze
          python agenti/main.py 2>&1 | tee bozze/ultimo-log.txt

      - name: Salva le bozze
        run: |
          git config user.name "redazione-ai"
          git config user.email "actions@users.noreply.github.com"
          # Copio da parte quello che ha prodotto la redazione
          mkdir -p /tmp/out && cp bozze/ultimo-log.txt /tmp/out/ 2>/dev/null || true
          cp bozze/scaletta-*.md /tmp/out/ 2>/dev/null || true
          cp bozze/nuove.json /tmp/out/nuove.json 2>/dev/null || echo "[]" > /tmp/out/nuove.json
          # Riparto dall'ultima versione online (con le approvazioni di Davide) e AGGIUNGO le bozze nuove
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python agenti/unisci_bozze.py /tmp/out/nuove.json
            cp /tmp/out/ultimo-log.txt bozze/ 2>/dev/null || true
            cp /tmp/out/scaletta-*.md bozze/ 2>/dev/null || true
            rm -f bozze/nuove.json
            git add bozze
            git diff --cached --quiet && exit 0
            git commit -q -m "Bozze del $(date +%d/%m/%Y)"
            git push && exit 0
            sleep 5
          done
          exit 1
          
