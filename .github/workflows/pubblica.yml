name: Pubblica bozze approvate
on:
  push:
    paths: ["bozze/bozze.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python agenti/promuovi.py
      - name: Aggiorna il sito
        run: |
          git config user.name "redazione-ai"
          git config user.email "actions@users.noreply.github.com"
          git add bozze content
          git diff --cached --quiet || (git commit -m "Pubblicati articoli approvati" && git push)
