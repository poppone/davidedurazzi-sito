name: Benzina nella zona di Davide
on:
  schedule:
    - cron: "0 17 * * 0"   # domenica alle 18/19 italiane: scheda per il video del lunedì
  workflow_dispatch:
  pull_request:
    paths:
      - agenti/benzina.py
      - .github/workflows/benzina.yml
permissions:
  contents: write
concurrency: benzina
jobs:
  scheda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python agenti/benzina.py
      - name: Salva la scheda
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "redazione-ai"
          git config user.email "actions@users.noreply.github.com"
          git add stanza/benzina
          git diff --cached --quiet && exit 0
          git commit -m "Benzina: scheda del $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
