name: Rinnova token Instagram
on:
  schedule:
    - cron: "0 6 1,15 * *"   # il 1 e il 15 di ogni mese (il token dura 60 giorni)
  workflow_dispatch:
jobs:
  rinnova:
    runs-on: ubuntu-latest
    steps:
      - name: Rinnova e salva i token (Davide e Aurora)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_AURORA_TOKEN: ${{ secrets.IG_AURORA_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          FALLITI=0
          for NOME in IG_ACCESS_TOKEN IG_AURORA_TOKEN; do
            VECCHIO="${!NOME}"
            if [ -z "$VECCHIO" ]; then echo "$NOME non impostato: salto."; continue; fi
            R=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$VECCHIO")
            NUOVO=$(echo "$R" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
            if [ -z "$NUOVO" ]; then echo "Rinnovo di $NOME non riuscito. Rigenera il token dal pannello Meta."; FALLITI=1; continue; fi
            echo "::add-mask::$NUOVO"
            if [ -n "$GH_TOKEN" ]; then
              gh secret set "$NOME" --body "$NUOVO" --repo "$GITHUB_REPOSITORY"
              echo "$NOME rinnovato e salvato."
            else
              echo "$NOME rinnovato, ma senza GH_PAT non posso salvarlo: aggiungilo per il rinnovo automatico."
            fi
          done
          exit $FALLITI
