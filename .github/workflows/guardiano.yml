name: Guardiano delle chiavi
on:
  schedule:
    - cron: "17 5 * * *"   # ogni mattina, prima del giro di Finch delle 7:52
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency: guardiano
jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python agenti/guardiano.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          TWITCH_BOT_TOKEN: ${{ secrets.TWITCH_BOT_TOKEN }}
      - name: Salva il controllo
        run: |
          git config user.name "guardiano-ai"
          git config user.email "actions@users.noreply.github.com"
          git add stanza/guardiano.json stanza/bacheca.json
          git diff --cached --quiet && exit 0
          git commit -m "Guardiano: controllo del $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
