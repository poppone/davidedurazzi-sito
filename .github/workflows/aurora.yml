name: Aurora Riva (post Instagram)
# Pubblica i post approvati di social/aurora.json all'ora scritta in `quando`.
# Gira ogni ora di giorno e a ogni modifica della coda o delle immagini.
on:
  schedule:
    - cron: "3 5-21 * * *"
  push:
    branches: [main]
    paths: ["social/aurora.json", "aurora/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: aurora
jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Controlla la coda
        run: python agenti/aurora.py controlla
      - name: Pubblica i post in orario
        run: python agenti/aurora.py pubblica
        env:
          IG_AURORA_TOKEN: ${{ secrets.IG_AURORA_TOKEN }}
      - name: Registra l'esito
        run: |
          git config user.name "aurora-ai"
          git config user.email "actions@users.noreply.github.com"
          git add social/aurora.json
          git diff --cached --quiet && exit 0
          git commit -m "Aurora: esito pubblicazioni"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
